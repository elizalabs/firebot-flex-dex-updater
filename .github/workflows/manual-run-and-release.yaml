on:
  workflow_dispatch:
    inputs:
      pokedex:
        description: 'Pokedex'
        required: true
        type: string

jobs:
  check-new-pokedex:
    runs-on: ubuntu-latest
    steps:
      - uses: $/.github/actions/release-setup-steps
        with:
          pokedex: ${{ inputs.pokedex }}

  release-new-pokedex:
