name: release on updated data/output.json
on:
  push:
    branches: main
    paths: data/output.json
permissions:
  contents: write
jobs:
  release-on-updated-output:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: get version from data/output.json
        run: |
          version=$(node -e 'var fs = require("node:fs"); console.log(JSON.parse(fs.readFileSync("data/output.json", "utf-8"))[1])')
          echo "VERSION=${version//:/.}" >> "$GITHUB_ENV"

      - run: git log
      - name: get changelog
        run: |
          last_sha=$(git rev-list -1 HEAD~1 -- data/output.json)
          git archive $last_sha data/output.json | tar -xO data/output.json > data/old.json
          echo $last_sha
          head data/old.json -n3
          changelog=$(npm run --silent check)
          echo 'changelog<<EOD' >> "$GITHUB_ENV"
          echo "$changelog" >> "$GITHUB_ENV"
          echo EOD >> "$GITHUB_ENV"

      - run: echo "$changelog"

