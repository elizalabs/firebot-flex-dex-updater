name: "shared release setup steps"
description: "shared release setup steps"
inputs:
  pokedex:
    description: "Pokedex"
    required: true
    type: string
runs:
  using: composite
  steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: npm install
      shell: bash
      run: npm install
    - name: save pokedex to json
      env:
        INPUT_POKEDEX: ${{ inputs.pokedex }}
      run: echo "$INPUT_POKEDEX" > data/pokedex.json
      shell: bash
    - name: backup existing output.json
      shell: bash
      run: cp data/output.json data/old.json
    - name: npm run exec
      shell: bash
      run: npm run exec

    # run `npm run check` - display the output to users, and save for changelog
    - name: npm run check
      shell: bash
      run: npm run check
